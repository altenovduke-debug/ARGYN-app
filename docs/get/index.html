<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать ARGYNS</title>
    <meta name="description" content="Скачайте приложение ARGYNS в App Store или Google Play.">
    <link rel="canonical" href="https://argyns.kz/get/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ARGYNS">
    <meta property="og:title" content="Скачать ARGYNS">
    <meta property="og:description" content="Скачайте приложение ARGYNS в App Store или Google Play.">
    <meta property="og:url" content="https://argyns.kz/get/">
    <meta property="og:image" content="https://argyns.kz/images/app_icon_opaque.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:locale" content="ru_RU">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <style>
        :root {
            --color-background: #f5f5f7;
            --color-surface: #ffffff;
            --color-text: #1d1d1f;
            --color-secondary-text: #6e6e73;
            --color-primary: #0071e3;
            --color-primary-hover: #0077ed;
            --radius-card: 24px;
            --radius-button: 14px;
            --space-small: 12px;
            --space-medium: 20px;
            --space-large: 32px;
            --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: var(--space-medium);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--color-text);
            background: var(--color-background);
            text-align: center;
        }

        .card {
            width: min(100%, 440px);
            padding: var(--space-large);
            border-radius: var(--radius-card);
            background: var(--color-surface);
            box-shadow: var(--shadow-card);
        }

        .app-icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
        }

        h1 {
            margin: var(--space-medium) 0 var(--space-small);
            font-size: 30px;
        }

        p {
            margin: 0 0 var(--space-large);
            color: var(--color-secondary-text);
            font-size: 17px;
            line-height: 1.5;
        }

        .store-link {
            display: none;
            width: 100%;
            padding: 15px var(--space-medium);
            border-radius: var(--radius-button);
            color: var(--color-surface);
            background: var(--color-primary);
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
        }

        .store-link.visible {
            display: block;
        }

        .store-link:hover,
        .store-link:focus-visible {
            background: var(--color-primary-hover);
        }

        .store-link.visible + .store-link.visible {
            margin-top: var(--space-small);
        }
    </style>
</head>

<body>
    <main class="card">
        <img src="../images/app_icon_opaque.png" alt="ARGYNS" class="app-icon">
        <h1>Скачать ARGYNS</h1>
        <p id="statusMessage">Нажмите кнопку, чтобы открыть магазин приложений.</p>
        <a id="appStoreLink" class="store-link" href="https://apps.apple.com/app/id6759314097">
            Открыть в App Store
        </a>
        <a id="playStoreLink" class="store-link" href="https://play.google.com/store/apps/details?id=com.argyn.app">
            Открыть в Google Play
        </a>
        <noscript>
            <style>
                .store-link {
                    display: block;
                }
            </style>
        </noscript>
    </main>

    <script>
        (function () {
            var userAgent = navigator.userAgent || navigator.vendor || "";
            var isIOS = /iPad|iPhone|iPod/i.test(userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(userAgent);
            var storeUrl = null;
            var appStoreLink = document.getElementById("appStoreLink");
            var playStoreLink = document.getElementById("playStoreLink");

            if (isIOS) {
                appStoreLink.classList.add("visible");
                storeUrl = "https://apps.apple.com/app/id6759314097";
            } else if (isAndroid) {
                playStoreLink.classList.add("visible");
                storeUrl = "https://play.google.com/store/apps/details?id=com.argyn.app";
            } else {
                storeUrl = "https://argyns.kz/";
            }

            if (storeUrl) {
                document.getElementById("statusMessage").textContent =
                    "Перенаправляем в магазин приложений...";
                window.location.replace(storeUrl);
            }
        }());
    </script>
</body>

</html>
