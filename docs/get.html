<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать ARGYNS</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        :root {
            --color-background: #f5f5f7;
            --color-surface: #ffffff;
            --color-text: #1d1d1f;
            --color-secondary-text: #6e6e73;
            --color-primary: #0071e3;
            --color-primary-hover: #0077ed;
            --color-loader-track: #dedede;
            --radius-card: 24px;
            --radius-button: 14px;
            --space-small: 12px;
            --space-medium: 20px;
            --space-large: 32px;
            --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: var(--space-medium);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--color-text);
            background: var(--color-background);
            text-align: center;
        }

        .card {
            width: min(100%, 440px);
            padding: var(--space-large);
            border-radius: var(--radius-card);
            background: var(--color-surface);
            box-shadow: var(--shadow-card);
        }

        .app-icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
        }

        h1 {
            margin: var(--space-medium) 0 var(--space-small);
            font-size: 30px;
        }

        p {
            margin: 0;
            color: var(--color-secondary-text);
            font-size: 17px;
            line-height: 1.5;
        }

        .loader {
            width: 42px;
            height: 42px;
            margin: var(--space-large) auto var(--space-medium);
            border: 4px solid var(--color-loader-track);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .actions {
            display: none;
            margin-top: var(--space-large);
        }

        .actions.visible {
            display: block;
        }

        .store-link {
            display: none;
            width: 100%;
            padding: 15px var(--space-medium);
            border-radius: var(--radius-button);
            color: var(--color-surface);
            background: var(--color-primary);
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
        }

        .store-link:hover,
        .store-link:focus-visible {
            background: var(--color-primary-hover);
        }

        .store-link.visible {
            display: block;
        }

        .store-link + .store-link {
            margin-top: var(--space-small);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <img src="images/app_icon_opaque.png" alt="ARGYNS" class="app-icon">
        <h1>Скачать ARGYNS</h1>

        <div id="loadingState">
            <div class="loader" aria-hidden="true"></div>
            <p>Перенаправляем в магазин приложений...</p>
        </div>

        <div id="actions" class="actions">
            <p id="actionMessage">Нажмите кнопку, чтобы открыть магазин приложений.</p>
            <a id="appStoreLink" class="store-link" href="https://apps.apple.com/app/id6759314097">
                Открыть в App Store
            </a>
            <a id="playStoreLink" class="store-link" href="https://play.google.com/store/apps/details?id=com.argyn.app">
                Открыть в Google Play
            </a>
        </div>

        <noscript>
            <div class="actions visible">
                <p>Выберите магазин приложений:</p>
                <a class="store-link visible" href="https://apps.apple.com/app/id6759314097">Открыть в App Store</a>
                <a class="store-link visible" href="https://play.google.com/store/apps/details?id=com.argyn.app">Открыть в Google Play</a>
            </div>
        </noscript>
    </main>

    <script>
        (function () {
            var appStoreUrl = "https://apps.apple.com/app/id6759314097";
            var playStoreUrl = "https://play.google.com/store/apps/details?id=com.argyn.app";
            var userAgent = navigator.userAgent || navigator.vendor || "";
            var isIOS = /iPad|iPhone|iPod/i.test(userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(userAgent);
            var isInstagramBrowser = /Instagram|FBAN|FBAV/i.test(userAgent);

            var loadingState = document.getElementById("loadingState");
            var actions = document.getElementById("actions");
            var actionMessage = document.getElementById("actionMessage");
            var appStoreLink = document.getElementById("appStoreLink");
            var playStoreLink = document.getElementById("playStoreLink");

            function showActions(isEmbeddedBrowser) {
                loadingState.hidden = true;
                actions.classList.add("visible");

                if (isIOS) {
                    appStoreLink.classList.add("visible");
                } else if (isAndroid) {
                    playStoreLink.classList.add("visible");
                } else {
                    appStoreLink.classList.add("visible");
                    playStoreLink.classList.add("visible");
                }

                if (isEmbeddedBrowser) {
                    actionMessage.textContent = "Нажмите кнопку, чтобы открыть магазин приложений.";
                }
            }

            if (isInstagramBrowser) {
                appStoreLink.target = "_blank";
                appStoreLink.rel = "noopener noreferrer";
                playStoreLink.target = "_blank";
                playStoreLink.rel = "noopener noreferrer";
                showActions(true);
                return;
            }

            var storeUrl = isIOS ? appStoreUrl : (isAndroid ? playStoreUrl : "index.html");

            window.setTimeout(function () {
                showActions(false);
            }, 2500);

            window.location.replace(storeUrl);
        }());
    </script>
</body>

</html>
